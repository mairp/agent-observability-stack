receivers:
  otlp:
    protocols:
      # Content capture is ON (prompts/completions are large attributes), so raise the
      # ingest caps above the defaults (gRPC 4 MiB, HTTP 20 MiB) to 64 MiB per request.
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 67108864   # 64 MiB

processors:
  batch:
    timeout: 5s
    # Bound each export request: with full prompt/completion content a default-size
    # batch (8192 spans, unbounded bytes) could exceed a backend's gRPC message cap.
    send_batch_size: 256
    send_batch_max_size: 512
  memory_limiter:
    check_interval: 5s
    limit_percentage: 75
    spike_limit_percentage: 15
  # Phoenix groups traces into projects by the RESOURCE attribute openinference.project.name
  # (else everything lands in "default"). Derive it from service.name so each producer
  # (specstride, sovereign-policy, x, ...) is its own Phoenix project. `insert` = only when
  # the producer has not set it itself. Used ONLY in traces/phoenix: Tempo/ClickHouse data
  # is not modified (the receiver fan-out clones data for a mutating pipeline).
  resource/phoenix_project:
    attributes:
      - key: openinference.project.name
        from_attribute: service.name
        action: insert
  # NOTE: the former `attributes/scrub` processor (deleted gen_ai.prompt / gen_ai.completion /
  # gen_ai.request.messages / gen_ai.response.messages) was REMOVED ON PURPOSE (2026-09-25,
  # owner decision): full prompts and completions are captured and reach Tempo, Loki and
  # Phoenix. Rollback = restore it and put it back into the traces + logs pipelines.

exporters:
  # Traces -> Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Traces -> Arize Phoenix (second trace backend, fan-out). OTLP/HTTP protobuf to the
  # container-internal :6006, NOT Phoenix's gRPC :4317: Phoenix's gRPC server keeps the
  # hard-coded 4 MiB receive cap (not configurable in 20.16), while its HTTP /v1/traces
  # has no body limit — so large prompt/completion batches are never rejected.
  # Own sending_queue + retry: a Phoenix outage buffers here and never back-pressures
  # Tempo/ClickHouse (each exporter has an independent queue).
  otlphttp/phoenix:
    endpoint: http://phoenix:6006     # the exporter appends /v1/traces
    compression: gzip
    timeout: 30s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 5000                # batches, not spans (~2.5M spans at max batch 512)
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 30s
      max_elapsed_time: 900s          # keep retrying a down Phoenix for 15 min before dropping
  # Agent metrics -> exposed for Prometheus to scrape (job: otel-collector)
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  # Logs/events (e.g. Claude Code per-request events) -> Loki via its native OTLP endpoint
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  # Governed-fleet spans -> ClickHouse (15.1 Phase 4). Writes to the collector-compatible
  # Null ingest table `spans_otlp_ingest_v1`; the materialized view projects ONLY
  # allowlisted metadata into the queryable `spans_v1`. The schema is applied by the
  # clickhouse service's init scripts (create_schema:false here — the collector never
  # owns DDL). Connects to the sibling service on the CONTAINER-internal native port 9000
  # (host publishes the banded 5190); credentials are the inlined dev defaults below.
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=5s
    database: workflow_otel
    # Non-secret dev defaults, inlined here so the exporter lives ENTIRELY in this
    # bind-mounted file — adding the ClickHouse sink needs only a collector restart
    # (config re-read), never a container recreate, so the pre-existing collector
    # keeps its identity (15.1 Phase 4 / standing rule 10). Override in any non-local
    # environment by editing this file (it is the single source for the exporter).
    username: default
    password: ""
    create_schema: false
    async_insert: true
    compress: lz4
    # Only the traces pipeline exports to ClickHouse (spans land in the Null ingest
    # table; the MV projects allowlisted metadata into spans_v1). Logs/metrics keep
    # their existing Loki/Prometheus sinks, so no logs/metrics table config is set.
    traces_table_name: spans_otlp_ingest_v1
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      level: basic
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, clickhouse]
    # Additive fan-out: the SAME otlp receiver feeds a second traces pipeline for Phoenix.
    # Separate pipeline = its own processors (project mapping) and its own exporter queue.
    traces/phoenix:
      receivers: [otlp]
      processors: [memory_limiter, resource/phoenix_project, batch]
      exporters: [otlphttp/phoenix]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
