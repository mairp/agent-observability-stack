receivers:
  otlp:
    protocols:
      # Content capture is ON (prompts/completions are large attributes), so raise the
      # ingest caps above the defaults (gRPC 4 MiB, HTTP 20 MiB) to 64 MiB per request.
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 67108864   # 64 MiB

  # Digital twin (Cloudflare Worker on the public edge) -> Cloudflare Tunnel (+ Access service
  # token) -> here. HTTP only, container-internal port 4320 (NOT published on the host; only the
  # cloudflared service on the `obs` network reaches it), and it requires its own bearer token.
  otlp/twin:
    protocols:
      http:
        endpoint: 0.0.0.0:4320
        max_request_body_size: 4194304   # 4 MiB; one request's trace is ~tens of KB
        auth:
          authenticator: bearertokenauth/twin

extensions:
  bearertokenauth/twin:
    filename: /etc/otelcol/secrets/twin_otel_token

processors:
  # The public door carries ONLY the twin's spans: anything else is dropped.
  filter/twin:
    error_mode: ignore
    traces:
      span:
        - not IsMatch(resource.attributes["service.name"], "^[a-z0-9]+-digital-twin$")
  resource/twin:
    attributes:
      - key: ingress
        value: cloudflare-tunnel
        action: upsert
  batch:
    timeout: 5s
    # Bound each export request: with full prompt/completion content a default-size
    # batch (8192 spans, unbounded bytes) could exceed a backend's gRPC message cap.
    send_batch_size: 256
    send_batch_max_size: 512
  memory_limiter:
    check_interval: 5s
    limit_percentage: 75
    spike_limit_percentage: 15
  # Phoenix groups traces into projects by the RESOURCE attribute openinference.project.name
  # (else everything lands in "default"). Derive it from service.name so each producer
  # (specstride, openclaw-gateway, ...) is its own Phoenix project. `insert` = only when
  # the producer has not set it itself. Used ONLY in traces/phoenix: Tempo/ClickHouse data
  # is not modified (the receiver fan-out clones data for a mutating pipeline).
  resource/phoenix_project:
    attributes:
      - key: openinference.project.name
        from_attribute: service.name
        action: insert
  # Phoenix's "kind" column is the OpenInference attribute openinference.span.kind (LLM, CHAIN,
  # TOOL, AGENT, GUARDRAIL, EVALUATOR, ...), not the OTel SpanKind; producers that don't set it
  # show "unknown". Derive it ONLY when the producer has not set it (so OpenClaw's own LLM/TOOL
  # spans are untouched): per-producer rules first, then generic name rules, then CHAIN.
  # Phoenix pipeline only - Tempo/ClickHouse unchanged.
  transform/phoenix_kind:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # specstride: run > phase > attempt > iter > tool, plus critic/verification gates
          - set(attributes["openinference.span.kind"], "AGENT") where attributes["openinference.span.kind"] == nil and resource.attributes["service.name"] == "specstride" and attributes["specstride.scope"] == "run"
          - set(attributes["openinference.span.kind"], "EVALUATOR") where attributes["openinference.span.kind"] == nil and resource.attributes["service.name"] == "specstride" and (attributes["specstride.scope"] == "critic" or attributes["specstride.scope"] == "verification")
          - set(attributes["openinference.span.kind"], "TOOL") where attributes["openinference.span.kind"] == nil and resource.attributes["service.name"] == "specstride" and IsMatch(name, "^tool( |$)")
          - set(attributes["openinference.span.kind"], "LLM") where attributes["openinference.span.kind"] == nil and resource.attributes["service.name"] == "specstride" and IsMatch(name, "^agent_text( |$)")
          # OpenClaw gateway: model/tool spans already carry LLM/TOOL; classify the rest
          - set(attributes["openinference.span.kind"], "AGENT") where attributes["openinference.span.kind"] == nil and resource.attributes["service.name"] == "openclaw-gateway" and (name == "openclaw.run" or name == "openclaw.harness.run")
          - set(attributes["openinference.span.kind"], "TOOL") where attributes["openinference.span.kind"] == nil and resource.attributes["service.name"] == "openclaw-gateway" and name == "openclaw.exec"
          # Generic, any producer: policy/guard steps by span name, then CHAIN as the default step kind.
          # Spans with GenAI semconv (gen_ai.operation.name: model calls, tool executions) are left
          # alone: Phoenix infers LLM/TOOL from them itself and renders the chat-message view.
          - set(attributes["openinference.span.kind"], "GUARDRAIL") where attributes["openinference.span.kind"] == nil and attributes["gen_ai.operation.name"] == nil and IsMatch(name, "(?i)(gate|guard|perimeter|killswitch|redact|sensitivity)")
          - set(attributes["openinference.span.kind"], "CHAIN") where attributes["openinference.span.kind"] == nil and attributes["gen_ai.operation.name"] == nil
  # Claude Code native traces (beta: CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1 + OTEL_TRACES_EXPORTER=otlp)
  # carry neither OpenInference nor gen_ai.operation.name, so Phoenix would show them as CHAIN with no
  # input. Map the real 2.1.283 attribute names onto OpenInference. Copy, never overwrite (`== nil`);
  # Phoenix pipeline only. Content attributes (new_context, tool_input, response.model_output) exist
  # only when ENABLE_BETA_TRACING_DETAILED + BETA_TRACING_ENDPOINT are set AND the session is -p/SDK;
  # interactive sessions fall back to user_prompt / full_command / the tool.output span event.
  # Claude Code tracing is beta: if names change on upgrade these stop matching (tests/smoke.sh checks).
  transform/phoenix_claude:
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - resource.attributes["service.name"] == "claude-code"
        statements:
          # interaction = one user turn (trace root, or child of an inbound TRACEPARENT)
          - set(attributes["openinference.span.kind"], "AGENT") where attributes["openinference.span.kind"] == nil and name == "claude_code.interaction"
          - set(attributes["input.value"], attributes["user_prompt"]) where attributes["input.value"] == nil and name == "claude_code.interaction"
          # llm_request = one Messages API call
          - set(attributes["openinference.span.kind"], "LLM") where attributes["openinference.span.kind"] == nil and name == "claude_code.llm_request"
          - set(attributes["llm.model_name"], attributes["model"]) where attributes["llm.model_name"] == nil and name == "claude_code.llm_request"
          - set(attributes["llm.provider"], "anthropic") where attributes["llm.provider"] == nil and name == "claude_code.llm_request"
          - set(attributes["llm.system"], "anthropic") where attributes["llm.system"] == nil and name == "claude_code.llm_request"
          - set(attributes["llm.token_count.completion"], attributes["output_tokens"]) where attributes["llm.token_count.completion"] == nil and name == "claude_code.llm_request"
          - set(attributes["llm.token_count.prompt_details.cache_read"], attributes["cache_read_tokens"]) where name == "claude_code.llm_request" and attributes["cache_read_tokens"] != nil
          - set(attributes["llm.token_count.prompt_details.cache_write"], attributes["cache_creation_tokens"]) where name == "claude_code.llm_request" and attributes["cache_creation_tokens"] != nil
          - set(attributes["llm.token_count.prompt"], attributes["input_tokens"] + attributes["cache_read_tokens"] + attributes["cache_creation_tokens"]) where attributes["llm.token_count.prompt"] == nil and name == "claude_code.llm_request" and attributes["input_tokens"] != nil and attributes["cache_read_tokens"] != nil and attributes["cache_creation_tokens"] != nil
          - set(attributes["llm.token_count.total"], attributes["llm.token_count.prompt"] + attributes["output_tokens"]) where attributes["llm.token_count.total"] == nil and name == "claude_code.llm_request" and attributes["llm.token_count.prompt"] != nil and attributes["output_tokens"] != nil
          - set(attributes["input.value"], attributes["new_context"]) where attributes["input.value"] == nil and name == "claude_code.llm_request"
          - set(attributes["output.value"], attributes["response.model_output"]) where attributes["output.value"] == nil and name == "claude_code.llm_request"
          # tool = one tool call (children: blocked_on_user, execution)
          - set(attributes["openinference.span.kind"], "TOOL") where attributes["openinference.span.kind"] == nil and name == "claude_code.tool"
          - set(attributes["tool.name"], attributes["tool_name"]) where attributes["tool.name"] == nil and name == "claude_code.tool"
          - set(attributes["input.value"], attributes["tool_input"]) where attributes["input.value"] == nil and name == "claude_code.tool"
          - set(attributes["input.value"], attributes["full_command"]) where attributes["input.value"] == nil and name == "claude_code.tool"
          - set(attributes["output.value"], attributes["new_context"]) where attributes["output.value"] == nil and name == "claude_code.tool"
          - set(attributes["openinference.span.kind"], "CHAIN") where attributes["openinference.span.kind"] == nil and IsMatch(name, "^claude_code\\.")
          - set(attributes["input.mime_type"], "text/plain") where attributes["input.value"] != nil and attributes["input.mime_type"] == nil
          - set(attributes["output.mime_type"], "text/plain") where attributes["output.value"] != nil and attributes["output.mime_type"] == nil
      # Tool output without detailed tracing arrives as a `tool.output` span event (OTEL_LOG_TOOL_CONTENT).
      - context: spanevent
        conditions:
          - resource.attributes["service.name"] == "claude-code"
        statements:
          - set(span.attributes["output.value"], attributes["output"]) where name == "tool.output" and span.attributes["output.value"] == nil
          - set(span.attributes["output.mime_type"], "text/plain") where name == "tool.output" and span.attributes["output.mime_type"] == nil
  # OpenClaw 2026.6.5 gaps (diagnostics-otel plugin has an empty configSchema; no config lever):
  #  - agent id is only emitted on openclaw.model.usage; the assembled system prompt carries
  #    "Runtime: agent=<id> | ... | channel=<ch>", so derive it on model-call spans (gen_ai.system_instructions
  #    is kept — Phoenix builds llm.input_messages from it). run/harness/tool spans have nothing to derive from.
  #  - session keys/ids are stripped by the plugin (DROPPED_OTEL_ATTRIBUTE_KEYS) -> no session.id possible.
  #  - content is exported 3x; Phoenix derives llm.* from gen_ai.*, so openclaw.content.* is pure
  #    duplication here (~81 KB of ~246 KB per model-call span). Phoenix pipeline only; Tempo keeps all.
  transform/phoenix_openclaw:
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - resource.attributes["service.name"] == "openclaw-gateway"
        statements:
          - 'merge_maps(cache, ExtractPatterns(attributes["gen_ai.system_instructions"], "Runtime: agent=(?P<agent>[A-Za-z0-9_.:-]{1,64})"), "upsert") where attributes["gen_ai.system_instructions"] != nil'
          - 'merge_maps(cache, ExtractPatterns(attributes["openclaw.content.system_prompt"], "Runtime: agent=(?P<agent>[A-Za-z0-9_.:-]{1,64})"), "insert") where attributes["openclaw.content.system_prompt"] != nil'
          - 'merge_maps(cache, ExtractPatterns(attributes["gen_ai.system_instructions"], "\\| channel=(?P<channel>[A-Za-z0-9_.:-]{1,64})"), "upsert") where attributes["gen_ai.system_instructions"] != nil'
          - 'set(attributes["openclaw.agent"], cache["agent"]) where attributes["openclaw.agent"] == nil and cache["agent"] != nil'
          - 'set(attributes["openclaw.channel"], cache["channel"]) where attributes["openclaw.channel"] == nil and cache["channel"] != nil'
          - 'set(attributes["agent.name"], attributes["openclaw.agent"]) where attributes["agent.name"] == nil and attributes["openclaw.agent"] != nil'
          - 'set(attributes["gen_ai.agent.name"], attributes["openclaw.agent"]) where attributes["gen_ai.agent.name"] == nil and attributes["openclaw.agent"] != nil'
          - 'delete_matching_keys(attributes, "^openclaw\\.content\\.")'
          # Privacy (owner decision 2026-09-28): Mira's workplace-support conversations are not
          # shown in Phoenix (LAN, no auth). Timing/tokens/model stay; Tempo keeps the content.
          - 'set(attributes["privacy.content_dropped"], "mira") where attributes["openclaw.agent"] == "mira"'
          - 'delete_matching_keys(attributes, "^(gen_ai\\.(system_instructions|input\\.messages|output\\.messages|tool\\.definitions)|input\\.value|output\\.value|llm\\.(input|output)_messages\\..*)$") where attributes["openclaw.agent"] == "mira"'
  # LiteLLM gateway (arize_phoenix callback, project litellm-gateway): 3 spans per call —
  # litellm_proxy_request > litellm_request > raw_gen_ai_request (request as sent upstream).
  # arize marks any request carrying `tools` as TOOL, so kind is set here on purpose (the one
  # exception to copy-don't-overwrite). Key alias / team / cached tokens only exist inside the
  # `metadata` JSON: lift them (user.id = key alias, so Phoenix groups by caller). The proxy
  # span repeats the full messages of its child: dropped here, Phoenix only.
  transform/phoenix_litellm:
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - resource.attributes["service.name"] == "litellm-gateway"
        statements:
          # One LLM span per call (litellm_request); the proxy wrapper is CHAIN and loses its token
          # counts here, else Phoenix sums every call's tokens twice.
          - set(attributes["openinference.span.kind"], "LLM") where name == "litellm_request"
          - set(attributes["openinference.span.kind"], "CHAIN") where name == "litellm_proxy_request"
          - delete_matching_keys(attributes, "^llm\\.token_count\\.") where name == "litellm_proxy_request"
          - set(attributes["openinference.span.kind"], "CHAIN") where name == "raw_gen_ai_request"
          - set(cache["md"], ParseJSON(attributes["metadata"])) where attributes["metadata"] != nil and IsMatch(attributes["metadata"], "^\\{")
          - set(attributes["litellm.key_alias"], cache["md"]["user_api_key_alias"]) where cache["md"]["user_api_key_alias"] != nil
          - set(attributes["litellm.key_alias"], "master") where attributes["litellm.key_alias"] == nil and cache["md"]["user_api_key_hash"] == "litellm_proxy_master_key"
          - set(attributes["litellm.team_alias"], cache["md"]["user_api_key_team_alias"]) where cache["md"]["user_api_key_team_alias"] != nil
          - set(attributes["user.id"], attributes["litellm.key_alias"]) where attributes["user.id"] == nil and attributes["litellm.key_alias"] != nil
          - set(attributes["llm.token_count.prompt_details.cache_read"], cache["md"]["usage_object"]["prompt_tokens_details"]["cached_tokens"]) where cache["md"]["usage_object"]["prompt_tokens_details"]["cached_tokens"] != nil
          - delete_matching_keys(attributes, "^(llm\\.input_messages|llm\\.output_messages)\\..*") where name == "litellm_proxy_request"
          - delete_key(attributes, "metadata") where name == "litellm_proxy_request"
          # The raw upstream span only repeats litellm_request's reply (choices): drop it here, so a
          # call whose request is filtered below cannot leak its reply through the sibling span.
          - delete_key(attributes, "llm.openai.choices") where name == "raw_gen_ai_request"
          # Privacy: Mira (OpenClaw, shared `openclaw` key) is recognised by the system prompt's
          # "Runtime: agent=mira" line; drop the conversation, keep timing/tokens/model.
          - 'set(attributes["privacy.content_dropped"], "mira") where IsMatch(attributes["llm.input_messages.0.message.content"], "Runtime: agent=mira\\b")'
          - 'set(attributes["privacy.content_dropped"], "mira") where IsMatch(attributes["input.value"], "Runtime: agent=mira\\b")'
          - delete_matching_keys(attributes, "^(input\\.value|output\\.value|llm\\.(input|output)_messages\\..*)$") where attributes["privacy.content_dropped"] == "mira"
  # Digital twin, Phoenix only: scanners/crawlers are ~99% of twin requests (GETs ->
  # method_not_allowed, foreign POSTs -> forbidden_origin) and would bury real conversations.
  # Drop those WHOLE traces here (the outcome sits on the root span only, so a per-span filter
  # can't). Tempo + ClickHouse keep them, so the digital-twin-traces dashboard still counts them.
  # Single inverted policy: matching traces are dropped, every other trace is kept.
  tail_sampling/twin_phoenix:
    decision_wait: 10s        # the Worker exports a whole request in one batch after responding
    num_traces: 20000
    policies:
      - name: drop-bot-rejects
        type: string_attribute
        string_attribute:
          key: twin.outcome
          values: [method_not_allowed, forbidden_origin]
          invert_match: true
  # NOTE: the former `attributes/scrub` processor (deleted gen_ai.prompt / gen_ai.completion /
  # gen_ai.request.messages / gen_ai.response.messages) was REMOVED ON PURPOSE (2026-09-25,
  # owner decision): full prompts and completions are captured and reach Tempo, Loki and
  # Phoenix. Rollback = restore it and put it back into the traces + logs pipelines.

exporters:
  # Traces -> Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Traces -> Arize Phoenix (second trace backend, fan-out). OTLP/HTTP protobuf to the
  # container-internal :6006, NOT Phoenix's gRPC :4317: Phoenix's gRPC server keeps the
  # hard-coded 4 MiB receive cap (not configurable in 20.16), while its HTTP /v1/traces
  # has no body limit — so large prompt/completion batches are never rejected.
  # Own sending_queue + retry: a Phoenix outage buffers here and never back-pressures
  # Tempo/ClickHouse (each exporter has an independent queue).
  otlphttp/phoenix:
    endpoint: http://phoenix:6006     # the exporter appends /v1/traces
    compression: gzip
    timeout: 30s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 5000                # batches, not spans (~2.5M spans at max batch 512)
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 30s
      max_elapsed_time: 900s          # keep retrying a down Phoenix for 15 min before dropping
  # Agent metrics -> exposed for Prometheus to scrape (job: otel-collector)
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  # Logs/events (e.g. Claude Code per-request events) -> Loki via its native OTLP endpoint
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  # Governed-fleet spans -> ClickHouse (15.1 Phase 4). Writes to the collector-compatible
  # Null ingest table `spans_otlp_ingest_v1`; the materialized view projects ONLY
  # allowlisted metadata into the queryable `spans_v1`. The schema is applied by the
  # clickhouse service's init scripts (create_schema:false here — the collector never
  # owns DDL). Connects to the sibling service on the CONTAINER-internal native port 9000
  # (host publishes the banded 5190); credentials are the inlined dev defaults below.
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=5s
    database: workflow_otel
    # Non-secret dev defaults, inlined here so the exporter lives ENTIRELY in this
    # bind-mounted file — adding the ClickHouse sink needs only a collector restart
    # (config re-read), never a container recreate, so the pre-existing collector
    # keeps its identity (15.1 Phase 4 / standing rule 10). Override in any non-local
    # environment by editing this file (it is the single source for the exporter).
    username: default
    password: ""
    create_schema: false
    async_insert: true
    compress: lz4
    # Only the traces pipeline exports to ClickHouse (spans land in the Null ingest
    # table; the MV projects allowlisted metadata into spans_v1). Logs/metrics keep
    # their existing Loki/Prometheus sinks, so no logs/metrics table config is set.
    traces_table_name: spans_otlp_ingest_v1
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
  debug:
    verbosity: basic

service:
  extensions: [bearertokenauth/twin]
  telemetry:
    metrics:
      level: basic
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, clickhouse]
    # Additive fan-out: the SAME otlp receiver feeds a second traces pipeline for Phoenix.
    # Separate pipeline = its own processors (project mapping) and its own exporter queue.
    traces/phoenix:
      receivers: [otlp]
      processors: [memory_limiter, resource/phoenix_project, transform/phoenix_claude, transform/phoenix_openclaw, transform/phoenix_litellm, transform/phoenix_kind, batch]
      exporters: [otlphttp/phoenix]
    # Digital twin via the tunnel receiver: same backends as every other producer. The Worker sets
    # openinference.span.kind itself, so the Phoenix transforms (all `== nil` guarded) keep them.
    traces/twin:
      receivers: [otlp/twin]
      processors: [memory_limiter, filter/twin, resource/twin, batch]
      exporters: [otlp/tempo, clickhouse]
    traces/twin-phoenix:
      receivers: [otlp/twin]
      processors: [memory_limiter, filter/twin, tail_sampling/twin_phoenix, resource/twin, resource/phoenix_project, transform/phoenix_claude, transform/phoenix_openclaw, transform/phoenix_litellm, transform/phoenix_kind, batch]
      exporters: [otlphttp/phoenix]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
