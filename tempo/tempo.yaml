# Grafana (11.x) runs TraceQL search/metrics as a gRPC STREAM to the datasource
# URL, http://tempo:3200. Without this, 3200 speaks HTTP only and every search
# fails with "http2: frame too large"; trace-by-id (plain HTTP) still works.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  # Full prompt/completion content makes traces large; the internal gRPC hops
  # (querier <-> frontend) default to 4 MiB and would fail trace-by-id on big traces.
  grpc_server_max_recv_msg_size: 67108864   # 64 MiB
  grpc_server_max_send_msg_size: 67108864

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
          max_recv_msg_size_mib: 64   # collector -> tempo batches carry prompt/completion content
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h   # 7 days of traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Generate RED metrics from spans so the agents dashboard works even before app metrics flow.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    # Tempo 2.6 has no per-attribute truncation (content is stored verbatim); the per-trace
    # cap is what drops data. Raise it from the 5 MB default so long agent sessions with
    # full prompts/completions are not rejected ("TRACE_TOO_LARGE").
    global:
      max_bytes_per_trace: 52428800   # 50 MiB
    metrics_generator:
      processors: [service-graphs, span-metrics]
